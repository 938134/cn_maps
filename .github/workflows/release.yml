name: 构建和发布

env:
  PACKAGE_NAME: ha_cnmaps
  ZIP_NAME: ha-cnmaps.zip

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置环境变量
        run: |
          INTEGRATION_DIR="custom_components/${{ env.PACKAGE_NAME }}"
          echo "INTEGRATION_DIR=$INTEGRATION_DIR" >> $GITHUB_ENV

      - name: 校验 manifest.json 完整性
        id: version
        run: |
          INTEGRATION_DIR="custom_components/${{ env.PACKAGE_NAME }}"
          MANIFEST="$INTEGRATION_DIR/manifest.json"
          VERSION=$(python3 -c "import json; print(json.load(open('$MANIFEST'))['version'])")
          NAME=$(python3 -c "import json; print(json.load(open('$MANIFEST'))['name'])")
          TAG="v${VERSION}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "📌 manifest.json: name=$NAME, version=$VERSION → 标签: $TAG"

      - name: 校验版本号一致性（const.py ↔ manifest.json）
        run: |
          python3 -c "
          import json, sys
          manifest = json.load(open('custom_components/${{ env.PACKAGE_NAME }}/manifest.json'))
          version = manifest['version']
          # 检查 const.py 是否从 manifest.json 读取 VERSION
          src = open('custom_components/${{ env.PACKAGE_NAME }}/const.py').read()
          if 'manifest.json' not in src:
              print('❌ const.py 未检测到 manifest.json 读取逻辑')
              sys.exit(1)
          if '.get(\"version\"' not in src and '.get(\"name\"' not in src:
              print('⚠️  const.py 未检测到 .get(\"version\") 或 .get(\"name\") 调用')
              sys.exit(1)
          print(f'✅ manifest.json version={version}, const.py 已从 manifest 读取')
          "

      - name: 清理已有发布
        if: always()
        continue-on-error: true
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "发现同名发布，正在删除..."
            gh release delete "${{ steps.version.outputs.tag }}" --cleanup-tag -y
            echo "已删除同名发布"
          else
            echo "没有找到同名发布，跳过删除"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 打包集成
        run: |
          if [ ! -d "$INTEGRATION_DIR" ]; then
            echo "错误: 集成目录 '$INTEGRATION_DIR' 不存在!"
            exit 1
          fi

          zip -r "${{ env.ZIP_NAME }}" "$INTEGRATION_DIR" \
            -x "*/__pycache__/*" "*/.git*" "*.pyc" "*.log" "*.tmp"

          if [ ! -f "${{ env.ZIP_NAME }}" ]; then
            echo "错误: ZIP文件创建失败!"
            exit 1
          fi

          echo "打包完成: ${{ env.ZIP_NAME }}"
          ls -la "${{ env.ZIP_NAME }}"

      - name: 获取构建时间
        id: get_date
        run: |
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT

      - name: 读取发布描述模板
        run: |
          sed -e "s|{{VERSION}}|${{ steps.version.outputs.tag }}|g" \
              -e "s|{{BUILD_DATE}}|${{ steps.get_date.outputs.build_date }}|g" \
              .github/release_body.md > /tmp/release_body.md
          echo "📄 发布描述已生成"

      - name: 创建发布
        uses: ncipollo/release-action@v1
        with:
          artifacts: "${{ env.ZIP_NAME }}"
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: "${{ steps.version.outputs.tag }}"
          name: "Release ${{ steps.version.outputs.tag }}"
          bodyFile: /tmp/release_body.md
          makeLatest: true
          skipIfReleaseExists: true

      - name: 清理临时文件
        if: always()
        run: |
          if [ -f "${{ env.ZIP_NAME }}" ]; then
            rm -f "${{ env.ZIP_NAME }}"
            echo "已清理临时文件"
          fi

      - name: 发布完成
        run: |
          echo "🎉 发布成功!"
          echo "📦 包名称: ${{ env.PACKAGE_NAME }}"
          echo "🏷️ 版本号: ${{ steps.version.outputs.tag }}"
          echo "📁 文件: ${{ env.ZIP_NAME }}"
